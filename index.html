<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="CAVIO — Plataforma inteligente de movilidad. Solicita tu viaje, negocia tu tarifa y viaja seguro."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAVIO" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>CAVIO — Movilidad inteligente</title>
    <style>
      /* Pantalla de arranque crítica (se muestra antes de cargar el bundle) */
      html,
      body {
        background: #000;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      .boot-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .boot-splash .boot-brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }
      .boot-splash .boot-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #c6f36b;
        animation: bootPulse 1.2s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-label="Cargando CAVIO">
        <img src="/icono-cavio.png" alt="CAVIO" />
        <span class="boot-brand">CAVIO</span>
        <span class="boot-dot"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
